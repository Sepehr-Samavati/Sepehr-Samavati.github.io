# Pages CMS configuration (https://pagescms.org/docs/)
# Open https://app.pagescms.org, sign in with GitHub and pick this repository.
# Every "Save" in the editor is a commit; GitHub Pages then rebuilds the site.
#
# Only content lives in the edited files. Layout, URLs and menu settings are in
# _config.yml (defaults), so nothing structural can be lost when saving here.

media:
  - name: images
    label: Images
    input: assets/images
    output: /assets/images
    extensions: [jpg, jpeg, png, webp]
    rename: safe
  - name: gallery
    label: Photography
    input: assets/images/gallery
    output: /assets/images/gallery
    extensions: [jpg, jpeg, png, webp]
    rename: safe
  - name: files
    label: Files (CV)
    input: assets/files
    output: /assets/files
    extensions: [pdf]

content:
  # ---------------------------------------------------------------- Home
  - name: home
    label: Homepage
    type: file
    path: index.md
    format: yaml-frontmatter
    fields:
      - name: landing-title
        label: Headline
        type: string
        required: true
      - name: tagline
        label: Text under the headline
        type: text
      - name: banner
        label: Background photo of the top section
        type: image
        options:
          media: images
      - name: description
        label: Description for search engines / link previews
        type: text

  # ---------------------------------------------------------------- Blog
  - name: posts
    label: Blog posts
    type: collection
    path: _posts
    exclude: [.gitkeep]
    filename: "{year}-{month}-{day}-{primary}.md"
    format: yaml-frontmatter
    view:
      fields: [title, date, tags]
      primary: title
      sort: [date, title]
      default:
        sort: date
        order: desc
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: date
        label: Date
        type: date
        options:
          format: yyyy-MM-dd
      - name: description
        label: Short description
        description: Shown in the post list. If empty, the first paragraph is used.
        type: text
      - name: tags
        label: Tags
        description: e.g. Embedded, Photography. Readers can filter posts by tag.
        type: string
        list: true
      - name: image
        label: Cover image (optional)
        type: image
        options:
          media: images
      - name: image_alt
        label: Cover image description (for screen readers)
        type: string
      - name: body
        label: Text
        type: rich-text
        options:
          format: markdown
          media: images

  # ---------------------------------------------------------------- Photography
  - name: gallery
    label: Photography
    type: file
    path: _data/gallery.yml
    format: yaml
    list: true
    fields:
      - name: image
        label: Photo
        type: image
        required: true
        options:
          media: gallery
      - name: caption
        label: Caption
        type: string
        required: true
      - name: instagram
        label: Instagram post link
        description: e.g. https://www.instagram.com/p/XXXXXXXX/
        type: string
      - name: alt
        label: Description for screen readers (optional, caption is used if empty)
        type: string

  # ---------------------------------------------------------------- Resume
  - name: resume
    label: Resume
    type: file
    path: _data/resume.yml
    format: yaml
    fields:
      - name: cv_file
        label: CV file (PDF) for the Download CV button
        type: file
        options:
          media: files
      - name: experience
        label: Work experience (newest first)
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{title} – {company}"
        fields:
          - name: title
            label: Job title
            type: string
            required: true
          - name: company
            label: Company
            type: string
            required: true
          - name: company_url
            label: Company website
            type: string
          - name: start
            label: Start (e.g. Jan 2024)
            type: string
          - name: end
            label: End (empty = Present, shown as your current role)
            type: string
          - name: location
            label: Location (optional, e.g. Milan, Italy)
            type: string
          - name: employer
            label: Employed via (optional, e.g. a consulting company)
            type: string
          - name: summary
            label: Summary paragraph (optional)
            type: text
          - name: bullets
            label: Bullet points
            type: text
            list: true
          - name: skills
            label: Skills used
            type: string
            list: true
      - name: education
        label: Education (newest first)
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{degree}"
        fields:
          - name: degree
            label: Degree
            type: string
            required: true
          - name: school
            label: School
            type: string
          - name: school_url
            label: School website
            type: string
          - name: location
            label: Location (optional)
            type: string
          - name: start
            label: Start year
            type: string
          - name: end
            label: End year (empty = in progress, shown as "Currently")
            type: string
          - name: description
            label: Description (optional)
            type: text
      - name: skills
        label: Skill groups
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{category}"
        fields:
          - name: category
            label: Group name (e.g. Technical Skills)
            type: string
            required: true
          - name: items
            label: Skills
            type: string
            list: true
      - name: publications
        label: Recent publications (newest first)
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{title} ({year})"
        fields:
          - name: title
            label: Title
            type: string
            required: true
          - name: authors
            label: Authors
            type: string
          - name: venue
            label: Conference / journal
            type: string
          - name: pages
            label: Pages (e.g. 250–255)
            type: string
          - name: year
            label: Year
            type: string
          - name: type
            label: Type (e.g. Conference paper, Journal article)
            type: string
          - name: scholar
            label: Google Scholar link of the paper
            type: string
          - name: doi
            label: DOI link (optional)
            type: string
          - name: pdf
            label: PDF / open access link (optional)
            type: string
      - name: certificates
        label: Certificates (newest first)
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{name}"
        fields:
          - name: name
            label: Certificate
            type: string
            required: true
          - name: issuer
            label: Issued by
            type: string
          - name: year
            label: Year
            type: string
          - name: url
            label: Credential link (optional)
            type: string
      - name: awards
        label: Honors and awards (newest first)
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{name}"
        fields:
          - name: name
            label: Award
            type: string
            required: true
          - name: issuer
            label: Given by
            type: string
          - name: year
            label: Year
            type: string
          - name: url
            label: Link (optional)
            type: string
      - name: recommendations
        label: Recommendations
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{name}"
        fields:
          - name: highlight
            label: Highlight (1–2 key sentences shown first)
            type: text
          - name: quote
            label: Full recommendation
            type: text
            required: true
          - name: name
            label: Name
            type: string
            required: true
          - name: role
            label: Their role (e.g. Senior Engineer at Company)
            type: string
          - name: relation
            label: How you know each other (optional)
            type: string
          - name: photo
            label: Photo (optional)
            type: image
            options:
              media: images
          - name: url
            label: LinkedIn profile (optional)
            type: string

  # ---------------------------------------------------------------- Projects
  - name: projects
    label: Projects
    type: collection
    path: _projects
    exclude: [.gitkeep]
    filename: "{primary}.md"
    format: yaml-frontmatter
    view:
      fields: [title, order]
      primary: title
      sort: [order, title]
      default:
        sort: order
        order: asc
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: image
        label: Image
        type: image
        options:
          media: images
      - name: image_alt
        label: Image description (for screen readers)
        type: string
      - name: image_height
        label: Image height in pixels (optional, e.g. 600 for tall screenshots)
        type: number
      - name: link
        label: Link (optional, adds a button)
        type: string
      - name: link_label
        label: Button text (default "More")
        type: string
      - name: order
        label: Position (1 = first)
        type: number
      - name: body
        label: Text
        type: rich-text
        options:
          format: markdown
          media: images

  # ---------------------------------------------------------------- Hobbies
  - name: hobbies
    label: Interests and Hobbies
    type: collection
    path: _hobbies
    exclude: [.gitkeep]
    filename: "{primary}.md"
    format: yaml-frontmatter
    view:
      fields: [title, order]
      primary: title
      sort: [order, title]
      default:
        sort: order
        order: asc
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: image
        label: Image
        type: image
        options:
          media: images
      - name: image_alt
        label: Image description (for screen readers)
        type: string
      - name: image_height
        label: Image height in pixels (optional)
        type: number
      - name: link
        label: Link (optional, adds a button)
        type: string
      - name: link_label
        label: Button text (default "More")
        type: string
      - name: order
        label: Position (1 = first)
        type: number
      - name: dota_account_id
        label: Dota 2 account ID (optional, shows live rank and top heroes)
        type: string
      - name: body
        label: Text
        type: rich-text
        options:
          format: markdown
          media: images

  # ---------------------------------------------------------------- Activities
  - name: activities
    label: Other Activities
    type: collection
    path: _activities
    exclude: [.gitkeep]
    filename: "{primary}.md"
    format: yaml-frontmatter
    view:
      fields: [title, date]
      primary: title
      sort: [date, title]
      default:
        sort: date
        order: desc
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: date
        label: Start date (newest shown first)
        type: date
        options:
          format: yyyy-MM-dd
      - name: end
        label: End (optional text, e.g. "June 2017" or "Present")
        type: string
      - name: image
        label: Image
        type: image
        options:
          media: images
      - name: image_alt
        label: Image description (for screen readers)
        type: string
      - name: image_height
        label: Image height in pixels (optional)
        type: number
      - name: link
        label: Link (optional, adds a button)
        type: string
      - name: link_label
        label: Button text (default "More")
        type: string
      - name: body
        label: Text
        type: rich-text
        options:
          format: markdown
          media: images

  # ---------------------------------------------------------------- Journey timeline
  - name: timeline
    label: My journey (About page timeline)
    type: file
    path: _data/timeline.yml
    format: yaml
    list: true
    fields:
      - name: date
        label: Date (YYYY or YYYY-MM, e.g. 2022-08)
        type: string
        required: true
      - name: title
        label: Title
        type: string
        required: true
      - name: place
        label: Where (optional)
        type: string
      - name: category
        label: Category (sets the color)
        type: select
        options:
          values: [education, work, research, volunteering, project, award]
      - name: text
        label: Short text (optional)
        type: text
      - name: image
        label: Small image (optional)
        type: image
        options:
          media: images
      - name: link
        label: Link (optional)
        type: string

  # ---------------------------------------------------------------- About
  - name: about
    label: About Me
    type: file
    path: about.md
    format: yaml-frontmatter
    fields:
      - name: title
        label: Page title
        type: string
        required: true
      - name: image
        label: Portrait
        type: image
        options:
          media: images
      - name: body
        label: Text
        type: rich-text
        options:
          format: markdown
