---
layout: page
---
{% comment %}
  About page: portrait on the left, text (the markdown body of about.md) on the right.
{% endcomment %}
<!-- Main -->
<div id="main" class="alt">

<!-- One -->
<section id="one">
	<div class="inner">
		<header class="major">
			<h1>{{ page.title }}</h1>
		</header>

		<div class="row">
			<div class="4u 12u$(medium)">
				<span class="image fit"><img src="{{ page.image | relative_url }}" alt="Portrait of {{ site.title }}" /></span>
			</div>
			<div class="8u$ 12u$(medium) prose">
				{{ content }}
			</div>
		</div>
	</div>
</section>

</div>
