# site settings
title: Sepehr Samavati
tagline: Software Engineer & Photographer   # shown after the name in the homepage's browser tab / search result
email: Sepehr.Samavati.Official@gmail.com
avatar: /assets/images/my_pic.jpg
description: "Personal website of Sepehr Samavati: software engineer and photographer based in Milan."
baseurl: "" # the subpath of your site, e.g. /blog
url: https://sepehrsamavati.com # the base hostname & protocol for your site
author:
  name: Sepehr Samavati
  twitter: SepehrSamavati
lang: en_US
street_address: 
city: Milan
state: 
zip_code: 
country: Italy

# homepage tiles
tiles-source: pages # accepts "posts" or "pages"
tiles-count: 6
# About me
# My Resume
# Interests and Hobbies
# Photography
# Projects
# Other Activities

# social settings (key must match name of font awesome icon)
# see https://fontawesome.com/icons?d=gallery&p=2&s=brands
# Icons are not shown if value is empty
# You need to restart jekyll for changes to have an effect
socials:
  GitHub: https://github.com/Sepehr-Samavati
  Instagram: https://www.instagram.com/skyskiesvision
  LinkedIn: https://www.linkedin.com/in/Sepehr-Samavati
  X-Twitter: https://x.com/SepehrSamavati

# build settings
markdown: kramdown

plugins:
  - jekyll-redirect-from   # old page URLs (e.g. /A-About Me.html) redirect to the new ones
  - jekyll-seo-tag         # <title>, description, link previews (Open Graph / X cards), structured data
  - jekyll-sitemap         # /sitemap.xml for search engines
  - jekyll-feed            # /feed.xml so readers can follow the blog

# Search engines and link previews (used by jekyll-seo-tag)
logo: /assets/icons/icon-512.png
social_image: /assets/images/my_pic.jpg   # preview image for pages that have no image of their own
social:
  name: Sepehr Samavati
  links:
    - https://github.com/Sepehr-Samavati
    - https://www.linkedin.com/in/Sepehr-Samavati
    - https://www.instagram.com/skyskiesvision
    - https://x.com/SepehrSamavati
twitter:
  username: SepehrSamavati
  card: summary_large_image
feed:
  path: blog/feed.xml

# Content collections: one markdown file per item, listed on their page.
collections:
  projects:            # _projects/   -> Projects page
    output: false
  hobbies:             # _hobbies/    -> Interests and Hobbies page
    output: false
  activities:          # _activities/ -> Other Activities page
    output: false

# Settings applied to files automatically, so content files (the ones edited
# through Pages CMS) only need to contain content: title, text, images.
defaults:
  - scope:
      path: "index.md"
    values:
      layout: home
      show_tile: false
  - scope:
      path: ""
      type: posts      # blog posts in _posts/
    values:
      layout: post
      permalink: /blog/:year/:month/:title/
  - scope:
      path: "about.md"
    values:
      layout: about
      description: "About Sepehr Samavati: software engineer in Milan, photographer, and leader at heart."
      permalink: /about/
      nav-menu: true
      nav_order: 1
      redirect_from: "/A-About Me.html"

sass:
  style: compressed

# Files that are part of the repository but must not be published.
# (On Jekyll 3 this list replaces Jekyll's defaults, so they are listed here.)
exclude:
- LICENSE-THEME.md
- README.md
- scripts/
- Makefile
- Gemfile
- Gemfile.lock
- vendor/
- .bundle/
- .jekyll-cache/
- .sass-cache/
- node_modules/
