# Photos on the Photography page, shown in this order.
#
# To add a photo:
#   1. Put the file in assets/images/gallery/
#   2. Run:  make images     (resizes it and creates its thumbnail)
#   3. Add an entry below.
#
#   image:   file name inside assets/images/gallery/          (required)
#   alt:     short description for screen readers / search    (recommended)
#   caption: text shown under the photo in full-screen view   (optional)
#   link:    e.g. the Instagram post URL, shown as a link     (optional)

