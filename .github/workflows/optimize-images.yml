# Resizes new images and creates gallery thumbnails after images are added
# (for example uploaded through Pages CMS), then commits the result.
# Same as running `make images` locally.
name: Optimize images

on:
  push:
    branches: [master]
    paths: ["assets/images/**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: optimize-images
  cancel-in-progress: false

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install Pillow
      - run: python scripts/optimize_images.py
      - name: Commit optimized images
        run: |
          if [ -n "$(git status --porcelain assets/images)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add assets/images
            git commit -m "Optimize images and create thumbnails"
            git pull --rebase
            git push
          else
            echo "Images already optimized."
          fi
